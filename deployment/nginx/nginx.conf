# =============================================================================
# Egyptian Legal AI — edge reverse proxy
#
# Design decision: the browser talks to ONE origin (nginx). /api/v1 and /health
# are proxied to the API container. Because that is same-origin, the browser
# sends NO CORS preflight at all — which permanently removes the class of bug
# that cost you several days (OPTIONS storms, allow_origin_regex fullmatch,
# exception handlers landing outside the CORS layer).
#
# Set NEXT_PUBLIC_API_BASE_URL=/api/v1 at build time for the frontend image.
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    charset       utf-8;          # Arabic content — never let this default to latin1

    # ---------------------------------------------------------------- logging
    log_format mizan '$remote_addr - $request_id [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     'rt=$request_time uct="$upstream_connect_time" '
                     'uht="$upstream_header_time" urt="$upstream_response_time" '
                     'rid="$sent_http_x_request_id"';
    access_log /var/log/nginx/access.log mizan;
    error_log  /var/log/nginx/error.log warn;

    # ------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/woff2;

    # --------------------------------------------------------------- buffers
    # Uploads stream to disk past 8 MB rather than buffering in RAM (32 GB host,
    # but several concurrent 50 MB uploads add up).
    client_body_buffer_size    8m;
    client_max_body_size       60m;   # > MAX_UPLOAD_SIZE_MB=50, leaves multipart overhead
    client_body_temp_path      /tmp/nginx/body;
    proxy_temp_path            /tmp/nginx/proxy;

    # ------------------------------------------------------- upstream sockets
    upstream mizan_web {
        server web:3000;
        keepalive 32;
    }
    upstream mizan_api {
        server api:8000;
        keepalive 32;
    }

    # ------------------------------------------------------------- rate limits
    # Login is the only endpoint worth brute-forcing. 5/min per IP is generous
    # for a human, useless for a credential-stuffing script.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=chat:10m rate=20r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ------------------------------------------------------------ HTTP server
    server {
        listen 80;
        server_name _;

        # Propagate the request id so FastAPI's RequestContextMiddleware can
        # reuse it instead of minting a second one. One id across both layers.
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # ------------------------------------------------------------ security
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        # No HSTS on plain HTTP: it would brick the host for a year.

        # ------------------------------------------------- API (versioned surface)
        # proxy_pass WITHOUT a URI preserves the path exactly: /api/v1/x -> /api/v1/x.
        # Adding a trailing slash here would strip /api/v1 and 404 every request.
        location /api/v1/ {
            limit_req zone=chat burst=40 nodelay;
            limit_conn conn 20;

            proxy_pass http://mizan_api;
            proxy_connect_timeout 5s;

            # Chat generation is the long pole: Groq + CPU rerank measured ~10-12 s,
            # and large-context answers can exceed a minute. 300 s matches
            # NEXT_PUBLIC_API_CHAT_TIMEOUT_MS.
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Login/registration get the tighter budget.
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://mizan_api;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Uploads: buffering off streams the body straight to the API, and the
        # timeout must cover embedding + indexing of a large document.
        location /api/v1/jobs/documents {
            proxy_pass http://mizan_api;
            proxy_request_buffering off;
            proxy_read_timeout 900s;      # matches WORKER_JOB_TIMEOUT_SECONDS
        }
        location /api/v1/documents/upload {
            proxy_pass http://mizan_api;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
        }

        # ------------------------------------------------- Health (unprefixed)
        # api/main.py mounts health routers WITHOUT the /api/v1 prefix.
        location /health/ {
            proxy_pass http://mizan_api;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            access_log off;               # polled every 30 s; keep the log readable
        }

        # ------------------------------------------------------ API docs
        # Remove this block in a public deployment — /docs exposes your surface.
        location ~ ^/(docs|redoc|openapi\.json)$ {
            proxy_pass http://mizan_api;
            proxy_read_timeout 30s;
        }

        # --------------------------------------------------- Next.js (default)
        location / {
            proxy_pass http://mizan_web;

            # SSE/streaming answers: disable buffering so tokens flush immediately.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;

            # WebSocket upgrade for HMR (dev) and any future live channel.
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Immutable hashed assets — long cache.
        location /_next/static/ {
            proxy_pass http://mizan_web;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}

# Map for the Connection header: "upgrade" when present, "" otherwise. Declared
# at stream level, hence outside server{}.
# NOTE: nginx parses this at http scope; keep it adjacent to the http block above.