[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -q
    --strict-markers
    --strict-config
    --tb=short
    -p no:cacheprovider

markers =
    slow: loads a model or touches disk heavily
    integration: needs Postgres/Qdrant running
    evaluation: retrieval-quality measurement, not a pass/fail unit test

filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::UserWarning:torch.*